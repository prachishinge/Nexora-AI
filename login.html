<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexora AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            background-color: var(--chat-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-container h2 {
            margin-bottom: 20px;
            color: var(--text-color);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: white;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background-color: var(--primary-hover);
        }
        .auth-links {
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px;">
            <div style="width: 38px; height: 38px; border-radius: 8px; background: rgba(16, 163, 127, 0.15); border: 1px solid rgba(16, 163, 127, 0.35); display: flex; align-items: center; justify-content: center; color: #10a37f;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
            </div>
            <span style="font-size: 1.4rem; font-weight: 700; color: #ececec; letter-spacing: -0.02em;">Nexora AI</span>
        </div>
        <h2>Welcome Back</h2>
        <p style="margin-bottom: 20px; font-size: 0.9rem; color: #94a3b8;">Log in to access your Nexora AI workspace</p>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email-input" placeholder="Enter your email" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" />
        </div>
        <button class="auth-btn" onclick="fakeLogin()">Log In</button>
        <div class="auth-links">
            <p>Don't have an account? <a href="#">Sign up here</a></p>
            <p style="margin-top: 10px;"><a href="index.html">← Back to Chat</a></p>
        </div>
    </div>

    <script>
        function fakeLogin() {
            const emailInput = document.getElementById('email-input').value;
            const email = emailInput ? emailInput : 'user@example.com';
            
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userEmail', email);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
