<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Nexora AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e222b 0%, #0d1117 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ececec;
        }
        .auth-card {
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(16px);
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-logo-badge {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(16, 163, 127, 0.16);
            border: 1px solid rgba(16, 163, 127, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #10a37f;
            margin: 0 auto 14px auto;
        }
        .auth-card h2 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        .auth-subtitle {
            margin: 0 0 24px 0;
            font-size: 0.88rem;
            color: #94a3b8;
        }
        .auth-tabs {
            display: flex;
            background: rgba(13, 17, 23, 0.8);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .auth-tab-btn {
            flex: 1;
            padding: 9px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .auth-tab-btn.active {
            background: #10a37f;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(16, 163, 127, 0.4);
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(13, 17, 23, 0.7);
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-group input:focus {
            border-color: #10a37f;
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.2);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #10a37f;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        .auth-btn:hover {
            background: #1a7f64;
        }
        .auth-btn:active {
            transform: scale(0.99);
        }
        .auth-footer {
            margin-top: 20px;
            font-size: 0.88rem;
            color: #94a3b8;
        }
        .auth-footer a {
            color: #10a37f;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo-badge">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
        </div>
        <h2 id="auth-heading">Welcome Back</h2>
        <p class="auth-subtitle" id="auth-sub">Log in to access your personal Nexora AI chat history</p>

        <div class="auth-tabs">
            <button class="auth-tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
            <button class="auth-tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group" id="name-group" style="display: none;">
                <label for="name-input">Full Name</label>
                <input type="text" id="name-input" placeholder="e.g. Sourabh Patil" autocomplete="name" />
            </div>

            <div class="form-group">
                <label for="email-input">Email Address</label>
                <input type="email" id="email-input" placeholder="Enter your email" required autocomplete="email" />
            </div>

            <div class="form-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Enter your password" required autocomplete="current-password" />
            </div>

            <button type="submit" class="auth-btn" id="submit-btn">Log In</button>
        </form>

        <div class="auth-footer">
            <span id="footer-text">Don't have an account?</span>
            <a href="javascript:void(0)" id="footer-toggle-btn" onclick="toggleMode()">Sign up here</a>
            <div>
                <a href="index.html" class="back-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Continue as Guest / Back to Chat
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const heading = document.getElementById('auth-heading');
            const sub = document.getElementById('auth-sub');
            const nameGroup = document.getElementById('name-group');
            const submitBtn = document.getElementById('submit-btn');
            const footerText = document.getElementById('footer-text');
            const footerToggleBtn = document.getElementById('footer-toggle-btn');

            if (mode === 'signup') {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                heading.textContent = 'Create an Account';
                sub.textContent = 'Sign up to keep your chat history isolated and secure';
                nameGroup.style.display = 'block';
                submitBtn.textContent = 'Create Account';
                footerText.textContent = 'Already have an account?';
                footerToggleBtn.textContent = 'Log in here';
            } else {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                heading.textContent = 'Welcome Back';
                sub.textContent = 'Log in to access your personal Nexora AI chat history';
                nameGroup.style.display = 'none';
                submitBtn.textContent = 'Log In';
                footerText.textContent = "Don't have an account?";
                footerToggleBtn.textContent = 'Sign up here';
            }
        }

        function toggleMode() {
            switchTab(currentMode === 'login' ? 'signup' : 'login');
        }

        function extractNameFromEmail(email) {
            if (!email || !email.includes('@')) return email || 'User';
            let rawName = email.split('@')[0];
            rawName = rawName.replace(/[._\-0-9]+/g, ' ').trim();
            if (!rawName) return email.split('@')[0];
            return rawName.split(' ')
                .filter(Boolean)
                .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                .join(' ');
        }

        function handleAuth(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email-input');
            const nameInput = document.getElementById('name-input');
            
            const email = (emailInput.value || '').trim().toLowerCase();
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }

            const rawName = (nameInput.value || '').trim();
            const displayName = rawName || extractNameFromEmail(email);

            // Set user authentication state
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', displayName);

            // Clean up any old unscoped legacy sessions to prevent cross-leak
            if (localStorage.getItem('chatSessions')) {
                localStorage.removeItem('chatSessions');
            }

            // Redirect back to chat with fresh session ready
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
